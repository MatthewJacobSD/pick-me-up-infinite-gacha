openapi: 3.0.3
info:
  title: Pick Me Up API
  version: 0.1.0
  description: >
    Engine-agnostic HTTP contract. Both Unity and Unreal clients connect
    to this single backend. Routes are not prefixed with engine identifiers.

servers:
  - url: http://localhost:5137
    description: Local development

security:
  - bearerAuth: []

paths:
  # ── Authentication ──────────────────────────────────────────────
  /api/auth/login/{provider}:
    get:
      tags: [Auth]
      operationId: login
      summary: Get OAuth redirect URL
      parameters:
        - name: provider
          in: path
          required: true
          schema: { type: string, enum: [google, facebook] }
      responses:
        "200":
          description: Redirect URL for the provider.
          content:
            application/json:
              schema:
                type: object
                properties:
                  redirectUrl: { type: string, format: uri }

  /api/auth/callback/{provider}:
    get:
      tags: [Auth]
      operationId: oauthCallback
      summary: OAuth provider redirects here after authentication
      parameters:
        - name: provider
          in: path
          required: true
          schema: { type: string, enum: [google, facebook] }
        - name: code
          in: query
          required: true
          schema: { type: string }
        - name: state
          in: query
          required: true
          schema: { type: string }
      responses:
        "302":
          description: Redirect to client with loginCode.

  /api/auth/consume-login-code:
    post:
      tags: [Auth]
      operationId: consumeLoginCode
      summary: Exchange loginCode for JWT tokens (called by engine)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [loginCode]
              properties:
                loginCode: { type: string }
      responses:
        "200":
          description: JWT tokens issued.
          content:
            application/json:
              schema:
                type: object
                properties:
                  sessionId: { type: string }
                  accessToken: { type: string }
                  refreshToken: { type: string }
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/auth/refresh:
    post:
      tags: [Auth]
      operationId: refreshToken
      summary: Refresh an expired access token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken: { type: string }
      responses:
        "200":
          description: New token pair.
          content:
            application/json:
              schema:
                type: object
                properties:
                  accessToken: { type: string }
                  refreshToken: { type: string }
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/auth/logout:
    post:
      tags: [Auth]
      operationId: logout
      summary: Revoke session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sessionId]
              properties:
                sessionId: { type: string }
      responses:
        "200":
          description: Session revoked.

  # ── Account Preferences ─────────────────────────────────────────
  /account/preferences:
    get:
      tags: [Preferences]
      operationId: getAllPreferences
      summary: Get all preference slices + version
      responses:
        "200":
          description: All preferences with version.
          content:
            application/json:
              schema:
                type: object
                properties:
                  version: { type: integer }
                  gameplay: { $ref: "#/components/schemas/GameplaySettings" }
                  accessibility: { $ref: "#/components/schemas/AccessibilitySettings" }
                  language: { $ref: "#/components/schemas/LanguageSettings" }
                  notifications: { $ref: "#/components/schemas/NotificationSettings" }
                  socialPreferences: { $ref: "#/components/schemas/SocialPreferencesSettings" }
                  audio: { $ref: "#/components/schemas/AudioSettings" }
                  ui: { $ref: "#/components/schemas/UiSettings" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /account/preferences/gameplay:
    get:
      tags: [Preferences]
      operationId: getGameplaySettings
      summary: Get gameplay preferences
      responses:
        "200":
          description: Gameplay settings + version.
          content:
            application/json:
              schema:
                type: object
                properties:
                  settings: { $ref: "#/components/schemas/GameplaySettings" }
                  version: { type: integer }
        "401": { $ref: "#/components/responses/Unauthorized" }
    put:
      tags: [Preferences]
      operationId: updateGameplaySettings
      summary: Update gameplay preferences
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GameplaySettingsDto" }
      responses:
        "200":
          description: Updated settings + new version.
          content:
            application/json:
              schema:
                type: object
                properties:
                  settings: { $ref: "#/components/schemas/GameplaySettings" }
                  version: { type: integer }
        "400": { $ref: "#/components/responses/Validation" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { $ref: "#/components/responses/VersionConflict" }

  /account/preferences/accessibility:
    get:
      tags: [Preferences]
      operationId: getAccessibilitySettings
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  settings: { $ref: "#/components/schemas/AccessibilitySettings" }
                  version: { type: integer }
        "401": { $ref: "#/components/responses/Unauthorized" }
    put:
      tags: [Preferences]
      operationId: updateAccessibilitySettings
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AccessibilitySettingsDto" }
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  settings: { $ref: "#/components/schemas/AccessibilitySettings" }
                  version: { type: integer }
        "400": { $ref: "#/components/responses/Validation" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { $ref: "#/components/responses/VersionConflict" }

  /account/preferences/language:
    get:
      tags: [Preferences]
      operationId: getLanguageSettings
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  settings: { $ref: "#/components/schemas/LanguageSettings" }
                  version: { type: integer }
        "401": { $ref: "#/components/responses/Unauthorized" }
    put:
      tags: [Preferences]
      operationId: updateLanguageSettings
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LanguageSettingsDto" }
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  settings: { $ref: "#/components/schemas/LanguageSettings" }
                  version: { type: integer }
        "400": { $ref: "#/components/responses/Validation" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { $ref: "#/components/responses/VersionConflict" }

  /account/preferences/notifications:
    get:
      tags: [Preferences]
      operationId: getNotificationSettings
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  settings: { $ref: "#/components/schemas/NotificationSettings" }
                  version: { type: integer }
        "401": { $ref: "#/components/responses/Unauthorized" }
    put:
      tags: [Preferences]
      operationId: updateNotificationSettings
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NotificationSettingsDto" }
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  settings: { $ref: "#/components/schemas/NotificationSettings" }
                  version: { type: integer }
        "400": { $ref: "#/components/responses/Validation" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { $ref: "#/components/responses/VersionConflict" }

  /account/preferences/social:
    get:
      tags: [Preferences]
      operationId: getSocialPreferences
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  settings: { $ref: "#/components/schemas/SocialPreferencesSettings" }
                  version: { type: integer }
        "401": { $ref: "#/components/responses/Unauthorized" }
    put:
      tags: [Preferences]
      operationId: updateSocialPreferences
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SocialPreferencesDto" }
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  settings: { $ref: "#/components/schemas/SocialPreferencesSettings" }
                  version: { type: integer }
        "400": { $ref: "#/components/responses/Validation" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { $ref: "#/components/responses/VersionConflict" }

  /account/preferences/audio:
    get:
      tags: [Preferences]
      operationId: getAudioSettings
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  settings: { $ref: "#/components/schemas/AudioSettings" }
                  version: { type: integer }
        "401": { $ref: "#/components/responses/Unauthorized" }
    put:
      tags: [Preferences]
      operationId: updateAudioSettings
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AudioSettingsDto" }
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  settings: { $ref: "#/components/schemas/AudioSettings" }
                  version: { type: integer }
        "400": { $ref: "#/components/responses/Validation" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { $ref: "#/components/responses/VersionConflict" }

  /account/preferences/ui:
    get:
      tags: [Preferences]
      operationId: getUiSettings
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  settings: { $ref: "#/components/schemas/UiSettings" }
                  version: { type: integer }
        "401": { $ref: "#/components/responses/Unauthorized" }
    put:
      tags: [Preferences]
      operationId: updateUiSettings
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UiSettingsDto" }
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  settings: { $ref: "#/components/schemas/UiSettings" }
                  version: { type: integer }
        "400": { $ref: "#/components/responses/Validation" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { $ref: "#/components/responses/VersionConflict" }

  # ── Social ──────────────────────────────────────────────────────
  /account/social/friends:
    get:
      tags: [Social]
      operationId: listFriends
      summary: List friend account IDs
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items: { type: string, format: uuid }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /account/social/friends/requests:
    get:
      tags: [Social]
      operationId: listFriendRequests
      summary: List pending incoming and outgoing friend requests
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/FriendRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [Social]
      operationId: sendFriendRequest
      summary: Send a friend request
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TargetAccountRequest" }
      responses:
        "200": { description: Request sent. }
        "400": { $ref: "#/components/responses/Validation" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/PolicyDenied" }
        "409": { $ref: "#/components/responses/Conflict" }

  /account/social/friends/requests/{senderId}/accept:
    post:
      tags: [Social]
      operationId: acceptFriendRequest
      parameters:
        - name: senderId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200": { description: Accepted. Both players are now friends. }
        "400": { $ref: "#/components/responses/Validation" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/PolicyDenied" }
        "409": { $ref: "#/components/responses/Conflict" }

  /account/social/friends/requests/{senderId}/decline:
    post:
      tags: [Social]
      operationId: declineFriendRequest
      parameters:
        - name: senderId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200": { description: Declined. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { $ref: "#/components/responses/Conflict" }

  /account/social/friends/requests/{receiverId}:
    delete:
      tags: [Social]
      operationId: cancelFriendRequest
      description: Cancel your own outgoing request. Path ID is the receiver.
      parameters:
        - name: receiverId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204": { description: Cancelled. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { $ref: "#/components/responses/Conflict" }

  /account/social/friends/{targetUserId}:
    delete:
      tags: [Social]
      operationId: removeFriend
      parameters:
        - name: targetUserId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204": { description: Friendship removed. }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /account/social/blocks:
    get:
      tags: [Social]
      operationId: listBlocks
      summary: List blocked account IDs
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items: { type: string, format: uuid }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [Social]
      operationId: blockAccount
      summary: Block a player (removes friendship, voids pending requests/invites)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TargetAccountRequest" }
      responses:
        "200": { description: Blocked. }
        "400": { $ref: "#/components/responses/Validation" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /account/social/blocks/{targetUserId}:
    delete:
      tags: [Social]
      operationId: unblockAccount
      parameters:
        - name: targetUserId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204": { description: Unblocked. }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /account/social/party/invites:
    get:
      tags: [Social]
      operationId: listPartyInvites
      summary: List pending party invites
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/PartyInvite" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [Social]
      operationId: sendPartyInvite
      summary: Send a party invite
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TargetAccountRequest" }
      responses:
        "200": { description: Invite sent. }
        "400": { $ref: "#/components/responses/Validation" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/PolicyDenied" }
        "409": { $ref: "#/components/responses/Conflict" }

  /account/social/party/invites/{senderId}/accept:
    post:
      tags: [Social]
      operationId: acceptPartyInvite
      parameters:
        - name: senderId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200": { description: Accepted. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/PolicyDenied" }
        "409": { $ref: "#/components/responses/Conflict" }

  /account/social/party/invites/{senderId}/decline:
    post:
      tags: [Social]
      operationId: declinePartyInvite
      parameters:
        - name: senderId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200": { description: Declined. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { $ref: "#/components/responses/Conflict" }

  /account/social/party/invites/{receiverId}:
    delete:
      tags: [Social]
      operationId: cancelPartyInvite
      description: Cancel your own outgoing invite. Path ID is the receiver.
      parameters:
        - name: receiverId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204": { description: Cancelled. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { $ref: "#/components/responses/Conflict" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    TargetUserId:
      name: targetUserId
      in: path
      required: true
      schema: { type: string, format: uuid }
    SenderId:
      name: senderId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ReceiverId:
      name: receiverId
      in: path
      required: true
      schema: { type: string, format: uuid }

  schemas:
    # ── Auth ──────────────────────────────────────────
    TargetAccountRequest:
      type: object
      required: [targetUserId]
      properties:
        targetUserId: { type: string, format: uuid }

    # ── Social ────────────────────────────────────────
    FriendRequest:
      type: object
      properties:
        id: { type: string, format: uuid }
        senderId: { type: string, format: uuid }
        receiverId: { type: string, format: uuid }
        status: { type: string, enum: [Pending, Accepted, Declined, Cancelled, Expired] }
        createdAt: { type: string, format: date-time }
        respondedAt: { type: string, format: date-time, nullable: true }
        expiresAt: { type: string, format: date-time, nullable: true }

    PartyInvite:
      type: object
      properties:
        id: { type: string, format: uuid }
        senderId: { type: string, format: uuid }
        receiverId: { type: string, format: uuid }
        status: { type: string, enum: [Pending, Accepted, Declined, Cancelled, Expired] }
        createdAt: { type: string, format: date-time }
        respondedAt: { type: string, format: date-time, nullable: true }
        expiresAt: { type: string, format: date-time, nullable: true }

    # ── Preferences ───────────────────────────────────
    GameplaySettings:
      type: object
      properties:
        visibleActionBars: { type: integer, minimum: 1, maximum: 6 }
        showCooldownNumbers: { type: boolean }
        showKeybindLabels: { type: boolean }
        lockActionBars: { type: boolean }
        showDamageNumbers: { type: boolean }
        showHealingNumbers: { type: boolean }
        showCriticalEffects: { type: boolean }
        showFloatingCombatText: { type: boolean }
        invertYAxis: { type: boolean }
        invertXAxis: { type: boolean }
        cameraSensitivity: { type: number, minimum: 0.1, maximum: 10 }
        fieldOfView: { type: number, minimum: 60, maximum: 120 }
        autoLoot: { type: boolean }
        highlightInteractables: { type: boolean }
        showNameplates: { type: boolean }
        showEnemyNameplates: { type: boolean }
        showFriendlyNameplates: { type: boolean }
        showPingIndicators: { type: boolean }
        autoRunToggle: { type: boolean }
        toggleSprint: { type: boolean }

    GameplaySettingsDto:
      allOf:
        - $ref: "#/components/schemas/GameplaySettings"
        - type: object
          required: [version]
          properties:
            version: { type: integer }

    AccessibilitySettings:
      type: object
      properties:
        colorblindMode: { type: string, enum: [None, Protanopia, Deuteranopia, Tritanopia] }
        highContrastMode: { type: boolean }
        subtitlesEnabled: { type: boolean }
        subtitleSize: { type: integer, minimum: 10, maximum: 40 }
        subtitleOpacity: { type: number, minimum: 0, maximum: 1 }
        subtitleSpeakerNames: { type: boolean }
        subtitleSoundEffects: { type: boolean }
        visualAudioIndicators: { type: boolean }
        footstepVisualization: { type: boolean }
        gunshotVisualization: { type: boolean }
        reducedMotion: { type: boolean }
        disableFlashingEffects: { type: boolean }
        simplifiedUI: { type: boolean }
        textSize: { type: integer, minimum: 10, maximum: 40 }

    AccessibilitySettingsDto:
      allOf:
        - $ref: "#/components/schemas/AccessibilitySettings"
        - type: object
          required: [version]
          properties:
            version: { type: integer }

    LanguageSettings:
      type: object
      properties:
        preferredLanguage: { type: string, enum: [en, nl, fr, de, it, es, pt, pl, ru, ja, ko, zh] }

    LanguageSettingsDto:
      allOf:
        - $ref: "#/components/schemas/LanguageSettings"
        - type: object
          required: [version]
          properties:
            version: { type: integer }

    NotificationSettings:
      type: object
      properties:
        eventNotifications: { type: boolean }
        friendRequestNotifications: { type: boolean }
        partyInviteNotifications: { type: boolean }
        systemAnnouncements: { type: boolean }
        rewardNotifications: { type: boolean }

    NotificationSettingsDto:
      allOf:
        - $ref: "#/components/schemas/NotificationSettings"
        - type: object
          required: [version]
          properties:
            version: { type: integer }

    SocialPreferencesSettings:
      type: object
      properties:
        friendRequests: { type: string, enum: [Everyone, FriendsOnly, Nobody] }
        messages: { type: string, enum: [Everyone, FriendsOnly, Nobody] }
        partyInvites: { type: string, enum: [Everyone, FriendsOnly, Nobody] }
        onlineStatus: { type: string, enum: [Everyone, FriendsOnly, Nobody] }

    SocialPreferencesDto:
      allOf:
        - $ref: "#/components/schemas/SocialPreferencesSettings"
        - type: object
          required: [version]
          properties:
            version: { type: integer }

    AudioSettings:
      type: object
      properties:
        masterVolume: { type: number, minimum: 0, maximum: 1 }
        musicVolume: { type: number, minimum: 0, maximum: 1 }
        musicMuted: { type: boolean }
        sfxVolume: { type: number, minimum: 0, maximum: 1 }
        sfxMuted: { type: boolean }
        voiceVolume: { type: number, minimum: 0, maximum: 1 }
        voiceMuted: { type: boolean }
        ambientVolume: { type: number, minimum: 0, maximum: 1 }
        ambientMuted: { type: boolean }

    AudioSettingsDto:
      allOf:
        - $ref: "#/components/schemas/AudioSettings"
        - type: object
          required: [version]
          properties:
            version: { type: integer }

    UiSettings:
      type: object
      properties:
        uiScale: { type: number, minimum: 0.5, maximum: 2 }
        textSize: { type: string, enum: [Small, Medium, Large] }
        iconSize: { type: string, enum: [Small, Medium, Large] }
        showMinimap: { type: boolean }
        showChatWindow: { type: boolean }
        showQuestTracker: { type: boolean }
        showActionBars: { type: boolean }
        minimapPosition: { type: string, enum: [TopLeft, TopRight, BottomLeft, BottomRight, LeftSide, RightSide, Center] }
        chatWindowPosition: { type: string, enum: [TopLeft, TopRight, BottomLeft, BottomRight, LeftSide, RightSide, Center] }
        questTrackerPosition: { type: string, enum: [TopLeft, TopRight, BottomLeft, BottomRight, LeftSide, RightSide, Center] }
        actionBarLayout: { type: string, enum: [Horizontal, Vertical] }
        inventoryLayout: { type: string, enum: [Grid, List] }
        chatLayout: { type: string, enum: [Compact, Expanded] }

    UiSettingsDto:
      allOf:
        - $ref: "#/components/schemas/UiSettings"
        - type: object
          required: [version]
          properties:
            version: { type: integer }

    # ── Errors ────────────────────────────────────────
    Problem:
      type: object
      properties:
        type: { type: string, format: uri, description: "Stable error type URI for engine branching" }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        code: { type: string, description: "Machine-readable error code" }

  responses:
    Validation:
      description: Request validation failed.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
          example:
            type: https://pickmeup/errors/validation
